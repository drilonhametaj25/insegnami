name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  # Lint and Type Check (fast feedback)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type checking
        run: npm run type-check

      - name: Lint code
        run: npm run lint

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker/docker-compose.yml config -q

  # Unit Tests
  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: test-secret-for-ci
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Check schema/migrations drift
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE shadow_db;'
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "postgresql://test_user:test_pass@localhost:5432/shadow_db" \
            --exit-code

      - name: Run unit tests (with coverage ratchet)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

      # Suite integration-DB (jest.config.integration.js): route handlers di
      # invoices/payroll/accounting eseguiti contro il service postgres del
      # job (DATABASE_URL già migrato dallo step "Run database migrations").
      - name: Run DB integration tests
        run: npm run test:integration-db

      # Spec eseguibile dei backup cifrati: il file NON deve essere leggibile
      # come gzip, deve decifrarsi con la chiave, e senza chiave lo script
      # deve rifiutarsi di produrre un dump in chiaro.
      - name: Backup encryption roundtrip
        env:
          BACKUP_ENCRYPTION_KEY: ci-roundtrip-test-key
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          BACKUP_DIR: /tmp/insegnami-backups
        run: |
          bash scripts/backup.sh
          FILE=$(ls "$BACKUP_DIR"/insegnami_backup_*.sql.gz.enc | head -1)
          test -s "$FILE"
          if gzip -t "$FILE" 2>/dev/null; then
            echo "ERROR: il backup è leggibile come gzip (non cifrato)"; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:BACKUP_ENCRYPTION_KEY -in "$FILE" \
            | gunzip | head -5 | grep -qi "PostgreSQL database dump"
          if env -u BACKUP_ENCRYPTION_KEY bash scripts/backup.sh 2>/dev/null; then
            echo "ERROR: senza chiave il backup doveva fallire"; exit 1
          fi
          echo "Backup encryption roundtrip OK"

  # Build Test (ensure it builds correctly)
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      NEXTAUTH_SECRET: build-test-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build

  # Smoke e2e BLOCCANTE per il deploy: ~15 scenari critici taggati @smoke
  # (login, isolamento tenant, permessi dati, checkout, portale famiglia,
  # SEO). La suite completa gira nel workflow nightly schedulato
  # (.github/workflows/e2e-nightly.yml) e resta lanciabile a mano
  # (.github/workflows/e2e-manual.yml).
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: 'e2e-ci-nextauth-key-32-chars-okay!!'
      NEXTAUTH_URL: http://localhost:3000
      MODE: saas
      NODE_ENV: test
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke e2e tests
        run: npx playwright test --project=chromium --grep "@smoke"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7

  # Deploy to Production (only on main branch push)
  # La produzione NON è raggiungibile senza smoke e2e verdi.
  deploy:
    runs-on: ubuntu-latest
    needs: [build, e2e-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Il file .env del server viene SOVRASCRITTO a ogni deploy: tutte le
          # variabili usate da deploy.sh/backup devono passare da questi secrets.
          SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          # Create .env locally with printf (safe for any special characters)
          POSTGRES_PASSWORD=$(echo "$DATABASE_URL" | sed -n 's/.*:\/\/[^:]*:\([^@]*\)@.*/\1/p')
          {
            printf "DATABASE_URL='%s'\n" "$DATABASE_URL"
            printf "NEXTAUTH_SECRET='%s'\n" "$NEXTAUTH_SECRET"
            printf "NEXTAUTH_URL='%s'\n" "$NEXTAUTH_URL"
            printf "STRIPE_SECRET_KEY='%s'\n" "$STRIPE_SECRET_KEY"
            printf "STRIPE_WEBHOOK_SECRET='%s'\n" "$STRIPE_WEBHOOK_SECRET"
            printf "SMTP_HOST='%s'\n" "$SMTP_HOST"
            printf "SMTP_PORT='%s'\n" "$SMTP_PORT"
            printf "SMTP_USER='%s'\n" "$SMTP_USER"
            printf "SMTP_PASSWORD='%s'\n" "$SMTP_PASSWORD"
            printf "EMAIL_FROM='%s'\n" "$EMAIL_FROM"
            printf "SUPERADMIN_EMAIL='%s'\n" "$SUPERADMIN_EMAIL"
            printf "SUPERADMIN_PASSWORD='%s'\n" "$SUPERADMIN_PASSWORD"
            printf "BACKUP_ENCRYPTION_KEY='%s'\n" "$BACKUP_ENCRYPTION_KEY"
            printf "POSTGRES_DB='insegnami'\n"
            printf "POSTGRES_USER='insegnami'\n"
            printf "POSTGRES_PASSWORD='%s'\n" "$POSTGRES_PASSWORD"
            printf "NODE_ENV='production'\n"
            printf "MODE='saas'\n"
          } > /tmp/.env.deploy
          scp /tmp/.env.deploy $USER@$HOST:/opt/insegnami/.env
          rm -f /tmp/.env.deploy

          # Clone/update repository on server
          ssh $USER@$HOST "
            cd /opt/insegnami
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/${{ github.repository }}
            fi
            git fetch origin main
            git reset --hard origin/main
          "

          # Run deployment script
          ssh $USER@$HOST "chmod +x /opt/insegnami/scripts/deploy.sh && /opt/insegnami/scripts/deploy.sh"

      - name: Verify deployment
        run: |
          # NEXTAUTH_URL è già un URL completo (https://...): niente prefisso
          # aggiuntivo (il vecchio 'https://https://...' rendeva il check un no-op).
          BASE="${{ secrets.NEXTAUTH_URL }}"
          BASE="${BASE%/}"
          sleep 10
          for i in {1..10}; do
            if curl -sf "$BASE/api/health" > /dev/null 2>&1; then
              echo "Deployment verified successfully!"
              exit 0
            fi
            echo "Waiting for deployment to be ready... (attempt $i/10)"
            sleep 15
          done
          echo "ERROR: deployment health check failed — l'app non risponde su $BASE/api/health"
          exit 1

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed! Check the logs above."
